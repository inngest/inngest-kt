name: Release Packages

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: "Release merge commit SHA to publish (must contain VERSION changes)"
        required: true
        type: string
      adapters_only:
        description: "Temporary 0.3.0 recovery: publish only adapters from the workflow revision"
        default: false
        type: boolean
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  packages: write

concurrency:
  group: release-tag-${{ inputs.release_commit || github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

env:
  RELEASE: true
  # Use the release bot token so tag pushes and release updates are performed by the release bot.
  RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Validate release token
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error title=Missing RELEASE_TOKEN::Configure the release bot token as the RELEASE_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.adapters_only && github.sha || inputs.release_commit || github.event.pull_request.merge_commit_sha }}
          token: ${{ env.RELEASE_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup git-cliff
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Tag and release packages
        env:
          MERGE_COMMIT_SHA: ${{ inputs.release_commit || github.event.pull_request.merge_commit_sha }}
          RELEASE_ADAPTERS_ONLY: ${{ inputs.adapters_only }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: ./scripts/release-merge.sh
